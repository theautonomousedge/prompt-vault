<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donor Dashboard — Prompt Vault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">Prompt Vault</a>
      <button class="mobile-toggle" aria-label="Menu">&#9776;</button>
      <ul class="navbar-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="browse.html">Browse Profiles</a></li>
        <li><a href="dashboard.html" class="active">Dashboard</a></li>
      </ul>
      <div class="navbar-auth" id="navbar-auth"></div>
    </div>
  </nav>

  <div class="page-content">
    <div class="container">
      <h2 class="mb-4">Your Impact</h2>

      <!-- Stats -->
      <div class="dashboard-stats">
        <div class="card stat-card">
          <div class="stat-number text-gold" id="stat-meals">0</div>
          <div class="stat-label">Meals Sent</div>
        </div>
        <div class="card stat-card">
          <div class="stat-number text-gold" id="stat-given">$0.00</div>
          <div class="stat-label">Total Given</div>
        </div>
        <div class="card stat-card">
          <div class="stat-number text-gold" id="stat-families">0</div>
          <div class="stat-label">Families Helped</div>
        </div>
      </div>

      <!-- Activity Feed -->
      <div class="card">
        <h3 class="mb-3">Recent Activity</h3>
        <div class="activity-feed" id="activity-feed">
          <div class="loading-spinner"><div class="spinner"></div></div>
        </div>
      </div>

      <div class="text-center mt-4">
        <a href="browse.html" class="btn btn-primary btn-lg">Send Another Meal</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; 2026 Prompt Vault. Built with love for the community.
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
