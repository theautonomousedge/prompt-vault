<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile — Prompt Vault</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="profile">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <a href="index.html" class="navbar-brand">Prompt Vault</a>
      <button class="mobile-toggle" aria-label="Menu">&#9776;</button>
      <ul class="navbar-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="browse.html">Browse Profiles</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
      </ul>
      <div class="navbar-auth" id="navbar-auth"></div>
    </div>
  </nav>

  <div class="page-content">
    <div class="container" style="max-width: 720px;">
      <a href="browse.html" class="text-muted" style="font-size:0.9rem;">&larr; Back to profiles</a>

      <div class="card mt-3" style="padding: 40px;">
        <h2 id="profile-name" style="margin-bottom: 4px;"></h2>
        <div id="verified-badge" class="verified-badge hidden" style="margin-bottom: 12px;">&#10003; Verified</div>
        <div id="profile-location" class="text-muted mb-3" style="font-size: 1rem;">&#128205;</div>

        <div style="display:flex; gap:32px; margin-bottom:24px;">
          <div>
            <div class="text-muted" style="font-size:0.8rem;">Member Since</div>
            <div id="profile-member-since" style="font-weight:600;"></div>
          </div>
          <div>
            <div class="text-muted" style="font-size:0.8rem;">Meals Received</div>
            <div id="profile-meals" style="font-weight:600; color:var(--accent-gold);"></div>
          </div>
        </div>

        <h4 style="margin-bottom:8px;">Their Story</h4>
        <p id="profile-story" style="line-height:1.8; margin-bottom:32px;"></p>

        <a id="send-meal-btn" href="#" class="btn btn-primary btn-lg" style="width:100%; text-align:center;">
          Send a Meal
        </a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        &copy; 2026 Prompt Vault. Built with love for the community.
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
